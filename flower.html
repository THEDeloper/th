<style>
/* CONTENEDOR DE CARTAS */
.cartas-container{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:999;
}

/* CARTA */
.carta{
  position:absolute;
  width:40px;
  height:30px;
  background:#ff4da6;
  border-radius:4px;
  cursor:pointer;
  pointer-events:auto;
  animation: caer linear forwards;
  box-shadow:0 0 10px rgba(255,0,128,0.6);
}

/* TRIANGULO DEL SOBRE */
.carta::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-left:20px solid transparent;
  border-right:20px solid transparent;
  border-top:15px solid #ff99cc;
}

/* ANIMACION CAIDA */
@keyframes caer{
  from{
    transform:translateY(-50px) rotate(0deg);
    opacity:1;
  }
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0.8;
  }
}

/* MENSAJE */
.mensaje{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:white;
  padding:20px;
  border-radius:10px;
  font-size:18px;
  color:#ff1493;
  box-shadow:0 0 20px rgba(255,0,128,0.5);
  z-index:1000;
  transition:0.3s;
  max-width:300px;
  text-align:center;
}

.mensaje.visible{
  transform:translate(-50%,-50%) scale(1);
}
</style>

<div class="mensaje" id="mensaje"></div>

/* GENERADOR INFINITO */
function mensajeAleatorio(){
  return mensajes[Math.floor(Math.random()*mensajes.length)];
}

/* CREAR CARTAS */
function crearCarta(){

  const carta = document.createElement("div");
  carta.className="carta";

  carta.style.left=Math.random()*100+"vw";
  carta.style.animationDuration=(5+Math.random()*5)+"s";

  carta.onclick=()=>{
    
    const msg=document.getElementById("mensaje");
    msg.innerText=mensajeAleatorio();
    msg.classList.add("visible");

    setTimeout(()=>{
      msg.classList.remove("visible");
    },3000);

    carta.remove();

  };

  document.querySelector(".cartas-container").appendChild(carta);

  setTimeout(()=>{
    carta.remove();
  },10000);

}

/* CREAR MUCHAS CARTAS INFINITAMENTE */
setInterval(crearCarta,800);

</script>
